<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=390, initial-scale=1">
  <title>Test — pipeline mockup</title>
  <script src="../design-system/tailwind.js"></script>
</head>
<body class="m-0 bg-neutral-100 flex justify-center font-sans">
  <div class="w-[390px] h-[844px] overflow-hidden relative bg-white flex flex-col">

    <!-- Status bar iOS -->
    <div class="h-[54px] px-6 flex items-end pb-2 justify-between text-[15px] font-semibold text-neutral-900">
      <span>9:41</span>
      <div class="flex items-center gap-1.5">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="24" height="12" viewBox="0 0 24 12" fill="none" stroke="currentColor"><rect x="0.5" y="0.5" width="20" height="11" rx="3"/><rect x="2" y="2" width="15" height="8" rx="1.5" fill="currentColor" stroke="none"/><path d="M22 4v4a2.5 2.5 0 0 0 0-4z" fill="currentColor" stroke="none"/></svg>
      </div>
    </div>

    <!-- Contenu -->
    <div class="flex-1 px-6 pt-10">
      <p class="text-[13px] font-semibold uppercase tracking-widest text-indigo-600">Hackathon Zurich</p>
      <h1 class="mt-3 text-[34px] leading-[1.1] font-bold text-neutral-900 tracking-tight">
        Le pipeline de mockups fonctionne.
      </h1>
      <p class="mt-4 text-[16px] leading-relaxed text-neutral-500">
        Cet écran est rendu en 390 × 844, capturé par Playwright et exporté dans
        <span class="font-mono text-[14px] text-neutral-700">out/test.png</span>.
      </p>

      <div class="mt-8 rounded-2xl border border-neutral-200 p-5">
        <div class="flex items-center justify-between">
          <span class="text-[14px] text-neutral-500">Écrans produits</span>
          <span class="text-[14px] font-semibold text-neutral-900">1 / 1</span>
        </div>
        <div class="mt-3 h-1.5 rounded-full bg-neutral-100 overflow-hidden">
          <div class="h-full w-full rounded-full bg-indigo-600"></div>
        </div>
        <p class="mt-3 text-[13px] text-neutral-400">Dernière capture — 12 sept., 09:41</p>
      </div>
    </div>

    <!-- Bouton -->
    <div class="px-6 pb-3">
      <button class="w-full h-[54px] rounded-2xl bg-neutral-900 text-white text-[17px] font-semibold">
        Commencer les écrans
      </button>
    </div>

    <!-- Home indicator -->
    <div class="h-[34px] flex items-center justify-center">
      <div class="w-[134px] h-[5px] rounded-full bg-neutral-900"></div>
    </div>
  </div>
</body>
</html>
