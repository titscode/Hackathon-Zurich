<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=390, initial-scale=1">
  <title>RIDE — Ride mode</title>
  <link rel="stylesheet" href="../design-system/tokens.css">
  <style>
    /* Ride mode (SCREENS.md 10) : fond bg, aucun accent, lisible avec des gants. */
    .screen.ride { display: flex; flex-direction: column; }
    .top { display: flex; align-items: center; justify-content: space-between; padding: 6px var(--gutter) 0; }
    .eta { text-align: center; margin: 12px 0 0; }
    .top .eta { display: flex; align-items: center; gap: 6px; }
    .top .eta .caption { color: var(--text-2); }
    .top .eta .end { color: var(--text-3); }
    .toggle { height: 34px; padding: 0 12px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border);
              display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 13px; font-weight: 500; }
    .toggle svg { color: var(--text-2); }

    /* Manœuvre : flèche 96 px text-1, distance display, rue title-2 */
    .man { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 var(--gutter) 40px; gap: 8px; }
    .man .arrow { color: var(--text-1); margin-bottom: 8px; }
    
    .man .title-2 { margin: 0; }
    .man .then { color: var(--text-2); margin: 8px 0 0; }

    /* Ligne basse : vitesse, météo à venir, autonomie */
    .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 0 var(--gutter) 44px; }
    .stats .stat { text-align: center; }
    .stats .stat + .stat { border-left: 1px solid var(--border); }
    .stats .display-2 { font-size: 24px; }
    .stats .stat.speed .display-2 { color: var(--accent-bright); }
    .stats .stat.weather .display-2 { color: var(--weather); }
    .stats .stat.weather .display-2 svg { vertical-align: -2px; margin-right: 4px; }
    .stats .unit { font-size: 13px; font-weight: 500; color: var(--text-2); margin-left: 3px; }

    /* Card feedback (#feedback) : bottom sheet, deux boutons secondaires larges */
    .scrim { position: absolute; inset: 0; background: rgba(10,11,13,.6); z-index: 26; display: none; }
    .fb { position: absolute; left: 0; right: 0; bottom: 0; z-index: 28; padding-bottom: 34px; display: none; }
    .screen.feedback .scrim, .screen.feedback .fb { display: block; }
    .fb .title-2 { margin: 0; }
    .fb .sub { margin: 4px 0 0; }
    .fb .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
    .fb .btn { height: 64px; flex-direction: column; gap: 4px; font-size: 13px; }
    .fb .btn svg { width: 24px; height: 24px; }
    .fb .btn.love svg { color: var(--positive); }
    .fb .btn.nope svg { color: var(--text-2); }
    .fb .hint { text-align: center; margin: 14px 0 0; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .fb .hint svg { color: var(--text-3); }

    /* Bike display (#bike) : artboard TFT 1920×720 (tokens.css .tft), aucun chrome téléphone */
    .tft { display: none; }
    body.bike .screen { display: none; }
    body.bike .tft { display: flex; align-items: center; padding: 0 96px; gap: 72px; }
    .tft .left { flex: none; width: 360px; display: flex; justify-content: center; color: var(--text-1); }
    .tft .center { flex: 1; min-width: 0; }
    .tft .center .tft-street { margin-top: 20px; }
    .tft .center .tft-then { margin-top: 16px; }
    .tft .right { flex: none; width: 420px; display: flex; flex-direction: column; gap: 40px; border-left: 2px solid var(--border); padding-left: 64px; }
    .tft .right .tft-label { margin-top: 8px; }
    .tft .right .unit { font-size: 32px; font-weight: 500; color: var(--text-2); margin-left: 8px; }
    .tft .right .speed .tft-value { color: var(--accent-bright); }
    .tft .right .weather .tft-value { color: var(--weather); }
    .tft .status { position: absolute; top: 40px; left: 96px; right: 96px; display: flex; justify-content: space-between; font-size: 28px; color: var(--text-3); font-weight: 500; }
  </style>
</head>
<body>
<div class="screen ride" id="screen">
  <div id="sb"></div>

  <div class="top">
    <a class="toggle" href="11-recap.html">End ride</a>
    <span class="toggle" id="toggle">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      Bike display
    </span>
  </div>

  <p class="caption eta" id="eta"></p>

  <div class="man">
    <svg class="arrow" width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg>
    <div class="display-xl" id="dist"></div>
    <h1 class="title-2" id="instr"></h1>
    <p class="caption then" id="then"></p>
  </div>

  <div class="stats" id="stats"></div>

  <div class="scrim"></div>
  <section class="sheet fb">
    <div class="sheet-handle"></div>
    <h2 class="title-2" id="fb-q"></h2>
    <p class="caption sub">Your rating goes to Marco_K and 3 210 riders.</p>
    <div class="btns">
      <a class="btn btn-secondary love" href="11-recap.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v12M15 5.9 14 10h5.8a2 2 0 0 1 1.9 2.6l-2.3 7a2 2 0 0 1-1.9 1.4H7V10l4.5-7.5A2 2 0 0 1 15 5.9z"/></svg>
        Loved it
      </a>
      <a class="btn btn-secondary nope" href="11-recap.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 14V2M9 18.1 10 14H4.2a2 2 0 0 1-1.9-2.6l2.3-7A2 2 0 0 1 6.5 3H17v11l-4.5 7.5a2 2 0 0 1-3.5-1.4z"/></svg>
        Not for me
      </a>
    </div>
    <p class="caption hint">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3zM6 11a6 6 0 0 0 12 0M12 17v4"/></svg>
      <span id="fb-hint"></span>
    </p>
  </section>

  <div id="hi"></div>
</div>

<!-- Artboard TFT 10,25" : même contenu, en paysage. Aucun chrome téléphone. -->
<div class="tft" id="tft">
  <div class="status"><span id="tft-eta"></span><span>RIDE · Most fun</span></div>
  <div class="left">
    <svg width="220" height="220" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg>
  </div>
  <div class="center">
    <div class="tft-dist" id="tft-dist"></div>
    <div class="tft-street" id="tft-instr"></div>
    <div class="tft-then" id="tft-then"></div>
  </div>
  <div class="right" id="tft-stats"></div>
</div>

<script src="data.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const M = RIDE.rideMode;
  $("sb").innerHTML = statusBar();
  $("hi").innerHTML = homeIndicator();
  $("eta").textContent = `ETA ${M.eta} · ${M.remaining} left`;
  $("dist").textContent = M.dist;
  $("instr").textContent = M.instr;
  $("then").textContent = M.then;
  const stats = [[M.speed, M.speedUnit, "Speed", "speed"], [M.weather, "", M.weatherIn, "weather"], [M.range, "", "Range", "range"]];
  const cloud = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19a4.5 4.5 0 0 0 0-9h-1.8A7 7 0 1 0 4 14.9"/><path d="M17.5 19H7"/></svg>';
  $("stats").innerHTML = stats.map(([v, u, l, k]) =>
    `<div class="stat ${k}"><div class="display-2">${k === "weather" ? cloud : ""}${v}${u ? `<span class="unit">${u}</span>` : ""}</div><div class="label">${l}</div></div>`).join("");
  $("fb-q").textContent = M.feedback.q;
  $("fb-hint").textContent = M.feedback.hint;

  /* TFT */
  $("tft-eta").textContent = `ETA ${M.eta} · ${M.remaining} left`;
  $("tft-dist").textContent = M.dist;
  $("tft-instr").textContent = M.instr;
  $("tft-then").textContent = M.then;
  $("tft-stats").innerHTML = stats.map(([v, u, l, k]) =>
    `<div class="${k}"><div class="tft-value">${v}${u ? `<span class="unit">${u}</span>` : ""}</div><div class="tft-label">${l}</div></div>`).join("");

  /* États figés (shot.py) : #feedback = card affichée, #bike = artboard TFT seul. Sans hash : la card arrive après 3 s. */
  const H = location.hash.slice(1);
  if (H === "feedback") $("screen").classList.add("feedback");
  else if (H === "bike") document.body.classList.add("bike");
  else setTimeout(() => $("screen").classList.add("feedback"), 3000);
</script>
</body>
</html>
