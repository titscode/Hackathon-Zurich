<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=390, initial-scale=1">
  <title>RIDE — Where to?</title>
  <link rel="stylesheet" href="../design-system/tokens.css">
  <style>
    .head { padding: 4px var(--gutter) 0; display: flex; align-items: center; gap: 6px; }
    .head .back-btn { margin-left: -10px; color: var(--text-2); }
    .head .title-1 { margin: 0; }

    /* Champ de recherche : surface-2, 52 px, focus (caret visible) */
    .field {
      margin: 16px var(--gutter) 0; height: 52px; padding: 0 16px; border-radius: 12px;
      background: var(--surface-2); border: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px;
    }
    .field svg { color: var(--text-2); flex: none; }
    .field .ph { flex: 1; font-size: 15px; color: var(--text-3); display: flex; align-items: center; }
    .field .caret { width: 2px; height: 20px; background: var(--text-1); margin-right: 2px; }

    .section { padding: 24px var(--gutter) 0; }
    .section .label { margin: 0; }
    .recents { padding: 4px var(--gutter) 0; }
    .recents .list-row { padding: 14px 0; }
    .recents .t p { font-size: 15px; }

    .out { padding: 24px var(--gutter) 0; }
    .out .btn svg { color: var(--text-2); }
    .out .caption { text-align: center; margin: 10px 0 0; }

    /* Suggestions du week-end : mêmes mini cards photo que 02 */
    .row { display: flex; gap: 12px; padding: 12px var(--gutter) 0; overflow-x: auto; scrollbar-width: none; }
    .row::-webkit-scrollbar { display: none; }
    .mini { flex: none; width: 160px; height: 200px; display: block; }
    .mini img { width: 100%; height: 100%; }
    .mini .txt { position: absolute; left: 12px; right: 12px; bottom: 12px; }
    .mini .name { font-size: 15px; font-weight: 600; margin: 0 0 3px; color: var(--text-1); }
    .mini .meta { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-2); }
    .mini .meta svg { color: var(--text-1); }
  </style>
</head>
<body>
<div class="screen">
  <div id="sb"></div>

  <div class="scroll">
    <header class="head">
      <a class="back-btn" href="02-home.html" aria-label="Back">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </a>
      <h1 class="title-1">Go somewhere</h1>
    </header>

    <div class="field">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <span class="ph" id="ph"></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3zM6 11a6 6 0 0 0 12 0M12 17v4"/></svg>
    </div>

    <div class="section"><p class="label">Recent</p></div>
    <div class="recents" id="recents"></div>

    <div class="out">
      <a class="btn btn-secondary" href="04-route.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4.5 20.3 12 17l7.5 3.3z"/></svg>
        Take me out of the city
      </a>
      <p class="caption">A loop from Munich, your way, back before dinner.</p>
    </div>

    <div class="section"><p class="label">Popular this weekend</p></div>
    <div class="row" id="near"></div>
  </div>

  <div id="tb"></div>
  <div id="hi"></div>
</div>

<script src="data.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const D = RIDE.destination;
  $("sb").innerHTML = statusBar();
  $("tb").innerHTML = tabBar("ride");
  $("hi").innerHTML = homeIndicator();
  $("ph").textContent = D.placeholder;
  const clock = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
  const chev = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';
  $("recents").innerHTML = D.recents.map(r => `
    <a class="list-row" href="${r.href}">
      <span class="ico">${clock}</span>
      <div class="t"><p class="body-strong">${r.name}</p><p class="caption">${r.sub}</p></div>
      <span class="end">${chev}</span>
    </a>`).join("");
  $("near").innerHTML = RIDE.segments.slice(0, 3).map(s => `
    <a class="card-photo mini" href="09-segment.html">
      <span class="ph"><img src="../assets/routes/${s.photo}.png" alt="" style="height:200px"><span class="overlay"></span></span>
      <span class="txt"><p class="name">${s.name}</p><span class="meta">${star(11)} ${s.rating} · ${s.km} · curv ${s.curv}</span></span>
    </a>`).join("");
</script>
</body>
</html>
