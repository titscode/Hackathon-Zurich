<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RIDE — TFT · Navigation</title>
  <link rel="stylesheet" href="../design-system/tokens.css">
  <style>
    /* Navigation (SCREENS.md tft-02) : manœuvre à gauche, corridor de route au centre, vitesse à droite. */
    .col-l { width: 360px; flex: none; display: flex; align-items: center; justify-content: center; color: var(--text-1); }
    .col-c { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
    .col-r { width: 420px; flex: none; display: flex; flex-direction: column; justify-content: center; gap: 36px; border-left: 2px solid var(--border); padding-left: 56px; }
    .col-c .tft-street { margin-top: 20px; }
    .col-c .tft-then { margin-top: 12px; }

    /* Corridor : la sortie entière sur une barre, segments en blocs colorés, position actuelle */
    .corridor { margin-top: 48px; }
    .corridor .tft-label { display: block; margin-bottom: 14px; }
    .corridor .bar { position: relative; height: 12px; border-radius: 999px; background: var(--border); }
    .corridor .bar i { position: absolute; top: 0; height: 100%; border-radius: 999px; }
    .corridor .bar i.positive { background: var(--positive); }  .corridor .bar i.accent { background: var(--accent-bright); }  .corridor .bar i.weather { background: var(--weather); }
    .corridor .bar .done { background: rgba(244,245,247,.28); left: 0; }
    .corridor .bar .me { position: absolute; top: 50%; width: 28px; height: 28px; border-radius: 50%; background: var(--text-1); border: 5px solid var(--bg); box-sizing: border-box; transform: translate(-50%, -50%); box-shadow: 0 0 0 10px var(--accent-soft); }
    .corridor .ends { display: flex; justify-content: space-between; font-size: 22px; color: var(--text-3); margin-top: 10px; }
    .next { display: flex; align-items: center; gap: 20px; margin-top: 28px; }
    .next .t .h { font-size: 32px; font-weight: 600; }
    .next .t .h b { color: var(--accent-bright); font-weight: 600; }
    .next .t .m { font-size: 24px; color: var(--text-2); margin-top: 4px; }
    .next .tft-stars { vertical-align: -1px; }

    .col-r .row { display: flex; align-items: center; justify-content: space-between; }
    .col-r .stat .tft-label { margin-top: 8px; }
    .col-r .weather .tft-value { color: var(--weather); font-size: 56px; display: flex; align-items: center; gap: 12px; }
    .col-r .range .tft-value { font-size: 56px; }
  </style>
</head>
<body>
<div class="tft page">
  <div class="tft-top"><span><b>RIDE</b> · Most fun</span><span id="eta"></span></div>

  <div class="tft-main">
    <div class="col-l">
      <svg width="220" height="220" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg>
    </div>

    <div class="col-c">
      <div class="tft-dist" id="dist"></div>
      <div class="tft-street" id="instr"></div>
      <div class="tft-then" id="then"></div>
      <div class="corridor">
        <span class="tft-label">Your ride · segments ahead</span>
        <div class="bar" id="bar"></div>
        <div class="ends"><span>Munich</span><span id="left"></span><span>Garmisch</span></div>
      </div>
      <div class="next" id="next"></div>
    </div>

    <div class="col-r">
      <div class="row tft-speed">
        <div class="stat"><div class="tft-value xl" id="speed"></div><div class="tft-label">Speed</div></div>
        <div class="tft-limit" id="limit"></div>
      </div>
      <div class="stat weather"><div class="tft-value" id="wx"></div><div class="tft-label" id="wx-in"></div></div>
      <div class="stat range"><div class="tft-value" id="range"></div><div class="tft-label">Range</div></div>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const M = RIDE.rideMode, C = RIDE.tft.corridor;
  $("eta").textContent = `ETA ${M.eta} · ${M.remaining} left`;
  $("dist").textContent = M.dist;
  $("instr").textContent = M.instr;
  $("then").textContent = M.then;
  $("left").textContent = `${Math.round(C.total * C.pos)} of ${C.total} km`;

  $("bar").innerHTML = `<i class="done" style="width:${C.pos * 100}%"></i>` +
    C.blocks.map(([n, a, b, c]) => `<i class="${c}" style="left:${a * 100}%;width:${(b - a) * 100}%"></i>`).join("") +
    `<span class="me" style="left:${C.pos * 100}%"></span>`;

  const s = segByName(C.next);
  const cloud = '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19a4.5 4.5 0 0 0 0-9h-1.8A7 7 0 1 0 4 14.9"/><path d="M17.5 19H7"/></svg>';
  $("next").innerHTML = `<img class="avatar tft-avatar" src="../assets/avatars/${s.avatar}.png" alt="">
    <div class="t"><div class="h"><b>${s.name}</b> in ${C.nextIn}</div>
    <div class="m">${C.nextNote} · <span class="tft-stars">${star(22)}</span> ${s.rating} by ${s.rides} riders · ${s.author}</div></div>`;

  $("speed").innerHTML = `${M.speed}<span class="tft-unit">${M.speedUnit}</span>`;
  $("limit").textContent = RIDE.tft.speedLimit;
  $("wx").innerHTML = `${cloud}${M.weather}`;
  $("wx-in").textContent = M.weatherIn;
  $("range").textContent = M.range;
</script>
</body>
</html>
