<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RIDE — TFT · Navigation</title>
  <link rel="stylesheet" href="../design-system/tokens.css">
  <style>
    /* Navigation (SCREENS.md tft-02) · une idée : le prochain virage. */
    .col-c .tft-street { margin-top: 16px; }
    .col-c .tft-then { margin-top: 12px; }
    .col-c .next { margin-top: 44px; }
  </style>
</head>
<body>
<div class="tft page">
  <div class="tft-top"><span><b>RIDE</b> · Most fun</span><span id="eta"></span></div>

  <div class="tft-main ride">
    <div class="col-l">
      <svg width="220" height="220" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg>
    </div>

    <div class="col-c">
      <div class="tft-dist" id="dist"></div>
      <div class="tft-street" id="instr"></div>
      <div class="tft-then" id="then"></div>
      <div class="tft-line next" id="next"></div>
    </div>

    <div class="col-r">
      <div class="tft-speed">
        <div class="tft-stat"><div class="tft-value xl" id="speed"></div><div class="tft-label">Speed</div></div>
        <div class="tft-limit" id="limit"></div>
      </div>
      <div class="tft-two">
        <div class="tft-stat"><div class="tft-value sm weather" id="wx"></div><div class="tft-label" id="wx-in"></div></div>
        <div class="tft-stat"><div class="tft-value sm" id="range"></div><div class="tft-label">Range</div></div>
      </div>
    </div>
  </div>

  <div class="tft-bottom"></div>
</div>

<script src="data.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const M = RIDE.rideMode, C = RIDE.tft.corridor, s = segByName(C.next);
  $("eta").textContent = `ETA ${M.eta} · ${M.remaining} left`;
  $("dist").textContent = M.dist;
  $("instr").textContent = M.instr;
  $("then").textContent = M.then;
  $("next").innerHTML = `<img class="avatar tft-avatar" src="../assets/avatars/${s.avatar}.png" alt="">
    <span class="tft-body"><b>${s.name}</b> in ${C.nextIn} · <span class="tft-stars">${star(26)}</span> ${s.rating} · ${C.nextNote}</span>`;
  $("speed").innerHTML = `${M.speed}<span class="tft-unit">${M.speedUnit}</span>`;
  $("limit").textContent = RIDE.tft.speedLimit;
  $("wx").textContent = M.weather;
  $("wx-in").textContent = M.weatherIn;
  $("range").textContent = M.range;
</script>
</body>
</html>
