<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=390, initial-scale=1">
  <title>RIDE — Profile</title>
  <link rel="stylesheet" href="../design-system/tokens.css">
  <style>
    .head { padding: 8px var(--gutter) 0; display: flex; align-items: center; gap: 16px; }
    .head .avatar { width: 72px; height: 72px; flex: none; }
    .head .title-1 { margin: 0; }
    .head .caption { margin: 2px 0 0; }
    .head .gear { margin-left: auto; width: 36px; height: 36px; display: grid; place-items: center; color: var(--text-2); }

    .nums { display: flex; padding: 16px var(--gutter) 0; }
    .nums .stat { flex: 1; text-align: center; }
    .nums .stat + .stat { border-left: 1px solid var(--border); }

    .badges { display: flex; gap: 8px; padding: 16px var(--gutter) 0; flex-wrap: wrap; }
    .badges::-webkit-scrollbar { display: none; }
    .badges .chip svg { color: var(--text-3); }

    .wrap { padding: 16px var(--gutter) 0; display: flex; flex-direction: column; gap: 12px; }
    .card .h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    .card .h .label { margin: 0; }
    .card .h .edit { color: var(--text-2); display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 500; }
    .card .list-row { padding: 8px 0; }
    .card .list-row:last-child { padding-bottom: 0; }
    .card .list-row .t p { font-size: 15px; }
    .card .list-row .ico { width: 28px; height: 28px; border-radius: 8px; }
    .card .list-row .ico svg { width: 14px; height: 14px; }

    .bike .row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; }
    .bike .row + .row { border-top: 1px solid var(--border); }
    .bike .row .body { font-size: 15px; }
    .bike .row .val { font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
    .bike .row .val .gauge-track { width: 72px; }
    .bike .ok { color: var(--positive); }

    .settings .list-row .end svg { color: var(--text-3); }
  </style>
</head>
<body>
<div class="screen">
  <div id="sb"></div>

  <div class="scroll">
    <header class="head">
      <img class="avatar" id="avatar" alt="">
      <div><h1 class="title-1" id="name"></h1><p class="caption" id="bike"></p></div>
      <a class="gear" href="12-profile.html" aria-label="Settings">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.3a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.4a2 2 0 0 0 .7 2.7l.2.1a2 2 0 0 1 1 1.7v.6a2 2 0 0 1-1 1.8l-.2.1a2 2 0 0 0-.7 2.7l.2.4a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.2a2 2 0 0 1 1 1.7V20a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.2a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.4a2 2 0 0 0-.7-2.7l-.2-.1a2 2 0 0 1-1-1.7v-.6a2 2 0 0 1 1-1.7l.2-.1a2 2 0 0 0 .7-2.7l-.2-.4a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.3a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </a>
    </header>

    <div class="nums" id="nums"></div>
    <div class="badges" id="badges"></div>

    <div class="wrap">
      <section class="card">
        <div class="h"><p class="label">What your companion knows</p>
          <a class="edit" href="06-voice.html">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>Edit</a>
        </div>
        <div id="prefs"></div>
      </section>

      <section class="card bike">
        <div class="h"><p class="label">Your bike</p><span class="caption" id="bike-name"></span></div>
        <div id="bike-rows"></div>
      </section>

      <section class="card settings">
        <div class="h"><p class="label">Settings</p></div>
        <div id="settings"></div>
      </section>
    </div>
  </div>

  <div id="tb"></div>
  <div id="hi"></div>
</div>

<script src="data.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const U = RIDE.user;
  $("sb").innerHTML = statusBar();
  $("tb").innerHTML = tabBar("profile");
  $("hi").innerHTML = homeIndicator();
  $("avatar").src = U.avatar;
  $("name").textContent = U.name;
  $("bike").textContent = `${U.bikeFull} · ${U.city}`;
  $("bike-name").innerHTML = `<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--positive);margin:0 6px 2px 0"></span>Connected`;

  $("nums").innerHTML = [[U.stats.rides, "Rides"], [U.stats.km, "Kilometres"], [U.stats.passes, "Passes"]]
    .map(([v, l]) => `<div class="stat"><div class="display-2">${v}</div><div class="label">${l}</div></div>`).join("");

  const badge = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a6 6 0 1 0 0-12 6 6 0 0 0 0 12z"/><path d="m8.2 13.8-1.7 7.5L12 18l5.5 3.3-1.7-7.5"/></svg>';
  $("badges").innerHTML = U.badges.map(b => `<span class="chip">${badge}${b}</span>`).join("");

  const ico = {
    corner: '<path d="M4 20v-7a4 4 0 0 1 4-4h12M15 14l5-5-5-5"/>',
    noroad: '<path d="M4 19 8 5M20 19 16 5M12 8v2M12 13v2M12 18v1"/><path d="M3 3l18 18"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    coffee: '<path d="M17 8h1a4 4 0 1 1 0 8h-1M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4zM6 2v2M10 2v2M14 2v2"/>',
    detour: '<path d="M3 17h4l3-10 4 10h7M17 14l3 3-3 3"/>',
    gravel: '<path d="M2 20h20M5 16l3-8 3 8M12 16l3-6 4 6"/><path d="M3 3l18 18"/>',
  };
  const svg = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  const icons = ["corner", "noroad", "sun", "coffee", "detour", "gravel"];
  $("prefs").innerHTML = U.prefs.map((p, i) => `
    <div class="list-row"><span class="ico">${svg(ico[icons[i]])}</span><div class="t"><p class="body">${p}</p></div></div>`).join("");

  const ok = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  $("bike-rows").innerHTML = `
    <div class="row"><span class="body">Fuel</span><span class="val"><span class="gauge-track"><span class="gauge-fill" style="display:block;width:${U.fuel}%"></span></span>${U.fuel} %</span></div>
    <div class="row"><span class="body">Range</span><span class="val">${U.range} km</span></div>
    <div class="row"><span class="body">Tyres</span><span class="val ok">${ok}OK</span></div>
    <div class="row"><span class="body">Last ride</span><span class="val t2" style="font-weight:400">${U.lastRide}</span></div>`;

  const chev = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';
  $("settings").innerHTML = RIDE.settings.map(([k, v]) => `
    <div class="list-row"><div class="t"><p class="body">${k}</p></div><span class="end">${v}${chev}</span></div>`).join("");
</script>
</body>
</html>
