<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RIDE — TFT · Ride complete</title>
  <link rel="stylesheet" href="../design-system/tokens.css">
  <style>
    /* Arrivée (SCREENS.md tft-05) : bilan de la sortie, segments notés à la molette, envoyé au téléphone. */
    .tft-main { flex-direction: column; gap: 28px; }
    .head { display: flex; align-items: center; gap: 20px; }
    .head .tft-cap { margin-left: auto; }

    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
    .stats .tft-card { display: flex; align-items: center; gap: 24px; padding: 24px 28px; }
    .stats .tft-value { font-size: 64px; }
    .stats .tft-label { margin-top: 6px; }

    .rated .tft-label { display: block; margin-bottom: 12px; }
    .rated .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .rated .tft-card { display: flex; align-items: center; gap: 18px; padding: 24px 28px; border-width: 2px; }
    .rated .tft-card.focus { border-color: var(--accent); box-shadow: 0 0 0 6px var(--accent-soft); }
    .rated .t { flex: 1; min-width: 0; }
    .rated .t .n { font-size: 28px; font-weight: 600; }
    .rated .t .m { font-size: 22px; color: var(--text-2); margin-top: 2px; }
    .rated .v { display: flex; align-items: center; gap: 8px; font-size: 24px; font-weight: 500; color: var(--positive); flex: none; }

    .tft-bottom .learn { display: flex; align-items: center; gap: 14px; font-size: 26px; color: var(--text-2); }
    .tft-bottom .learn svg { color: var(--accent-bright); flex: none; }
    .tft-bottom .learn b { color: var(--text-1); font-weight: 500; }
    .tft-bottom .sent { display: flex; align-items: center; gap: 28px; }
    .tft-bottom .sent .ok { display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 500; color: var(--positive); }
  </style>
</head>
<body>
<div class="tft page">
  <div class="tft-top"><span><b>RIDE</b> · Ride complete</span><span id="when"></span></div>

  <div class="tft-main">
    <div class="head">
      <div class="tft-title" id="title"></div>
      <span class="tft-tag accent">Most fun</span>
      <span class="tft-cap" id="sub"></span>
    </div>
    <div class="stats" id="stats"></div>
    <div class="rated">
      <span class="tft-label">Segments you rated · turn the wheel to change</span>
      <div class="cards" id="rated"></div>
    </div>
  </div>

  <div class="tft-bottom">
    <div class="learn">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4M22 5h-4M4 17v2M5 18H3"/></svg>
      <span>Your companion learned: <b id="learned"></b></span>
    </div>
    <div class="sent">
      <span class="ok"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg><span id="sent"></span></span>
      <span class="tft-hint">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><path d="M12 3v3M12 18v3"/></svg>
        <span id="close"></span>
      </span>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const R = RIDE.recap, T = RIDE.tft.recap;
  $("when").textContent = R.when;
  $("title").textContent = `${R.from} → ${R.to}`;
  $("sub").textContent = `${R.time} on the road · ${R.motorway} of motorway`;

  const gi = {
    Distance: ["accent", '<path d="M4 19 8 5M20 19 16 5M12 8v2M12 13v2M12 18v1"/>'],
    Riding: ["weather", '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],
    Passes: ["positive", '<path d="m3 20 6-14 4 8 2-3 6 9z"/>'],
    Curviness: ["accent", '<path d="M4 20v-7a4 4 0 0 1 4-4h12M15 14l5-5-5-5"/>'],
  };
  $("stats").innerHTML = [[R.km, "Distance"], [R.time, "Riding"], [R.passes, "Passes"], [R.curv, "Curviness"]].map(([v, l]) => `
    <div class="tft-card"><span class="ico-tint tft-ico ${gi[l][0]}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${gi[l][1]}</svg></span>
      <div><div class="tft-value">${v}</div><div class="tft-label">${l}</div></div></div>`).join("");

  const up = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v12M15 5.9 14 10h5.8a2 2 0 0 1 1.9 2.6l-2.3 7a2 2 0 0 1-1.9 1.4H7V10l4.5-7.5A2 2 0 0 1 15 5.9z"/></svg>';
  $("rated").innerHTML = R.rated.map(([n, v], i) => { const s = segByName(n); return `
    <div class="tft-card${i === 0 ? " focus" : ""}">
      <img class="avatar tft-avatar" src="../assets/avatars/${s.avatar}.png" alt="">
      <div class="t"><div class="n">${n}</div><div class="m">${s.author} · ${s.km} · curv ${s.curv}</div></div>
      <span class="v">${up}${v}</span>
    </div>`; }).join("");

  $("learned").textContent = R.learned;
  $("sent").textContent = T.sent;
  $("close").textContent = T.close;
</script>
</body>
</html>
