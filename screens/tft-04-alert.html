<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RIDE — TFT · Companion decision</title>
  <link rel="stylesheet" href="../design-system/tokens.css">
  <style>
    /* Décision du companion (SCREENS.md tft-04) : navigation en fond sous un voile, card de décision au centre,
       deux boutons Multi-Controller, la vitesse reste visible. */
    .col-l { width: 360px; flex: none; display: flex; align-items: center; justify-content: center; color: var(--text-1); }
    .col-c { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
    .col-c .tft-street { margin-top: 20px; }
    .col-c .tft-then { margin-top: 12px; }
    .col-r { width: 420px; flex: none; display: flex; flex-direction: column; justify-content: center; gap: 36px; border-left: 2px solid var(--border); padding-left: 56px;
             position: relative; z-index: 6; }        /* au-dessus du voile : la vitesse reste lisible */
    .col-r .row { display: flex; align-items: center; justify-content: space-between; }
    .col-r .stat .tft-label { margin-top: 8px; }
    .col-r .weather .tft-value { color: var(--weather); font-size: 56px; }
    .col-r .range .tft-value { font-size: 56px; }

    .decision {
      position: absolute; left: 96px; top: 50%; width: 1180px; transform: translateY(-50%); z-index: 7;
      background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 28px; padding: 36px 40px;
    }
    .decision .h { display: flex; align-items: center; gap: 24px; }
    .decision .h .ico-tint { width: 80px; height: 80px; border-radius: 20px; }
    .decision .h .ico-tint svg { width: 40px; height: 40px; }
    .decision .tft-body { margin-top: 6px; }
    .decision .tft-body b { color: var(--text-1); font-weight: 600; }
    .decision .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 28px; }
    .decision .tft-btn { width: 100%; }
    .decision .tft-hint { margin-top: 22px; justify-content: center; }
  </style>
</head>
<body>
<div class="tft page">
  <div class="tft-top"><span><b>RIDE</b> · Most fun</span><span id="eta"></span></div>

  <div class="tft-main">
    <div class="col-l">
      <svg width="220" height="220" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg>
    </div>
    <div class="col-c">
      <div class="tft-dist" id="dist"></div>
      <div class="tft-street" id="instr"></div>
      <div class="tft-then" id="then"></div>
    </div>
    <div class="col-r">
      <div class="row tft-speed">
        <div class="stat"><div class="tft-value xl" id="speed"></div><div class="tft-label">Speed</div></div>
        <div class="tft-limit" id="limit"></div>
      </div>
      <div class="stat weather"><div class="tft-value" id="wx"></div><div class="tft-label" id="wx-in"></div></div>
      <div class="stat range"><div class="tft-value" id="range"></div><div class="tft-label">Range</div></div>
    </div>
  </div>

  <div class="tft-scrim"></div>
  <section class="decision">
    <div class="h">
      <span class="ico-tint weather"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.9A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 2.5 8.2"/><path d="M16 14v6M8 14v6M12 16v6"/></svg></span>
      <div><div class="tft-title" id="title"></div><div class="tft-body" id="body"></div></div>
    </div>
    <div class="btns">
      <span class="tft-btn focus" id="keep"></span>
      <span class="tft-btn" id="switch"></span>
    </div>
    <div class="tft-hint">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><path d="M12 3v3M12 18v3"/></svg>
      <span id="hint"></span>
    </div>
  </section>
</div>

<script src="data.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const M = RIDE.rideMode, A = RIDE.tft.alert, alt = segByName(A.alt);
  $("eta").textContent = `ETA ${M.eta} · ${M.remaining} left`;
  $("dist").textContent = M.dist; $("instr").textContent = M.instr; $("then").textContent = M.then;
  $("speed").innerHTML = `${M.speed}<span class="tft-unit">${M.speedUnit}</span>`;
  $("limit").textContent = RIDE.tft.speedLimit;
  $("wx").textContent = M.weather; $("wx-in").textContent = M.weatherIn; $("range").textContent = M.range;

  $("title").textContent = A.title;
  $("body").innerHTML = `<b>${A.body}</b> · rated ${alt.rating} by ${alt.rides} riders`;
  $("keep").textContent = A.keep;
  $("switch").textContent = A.switchTo;
  $("hint").textContent = `Turn the wheel, press to choose · or say “${A.say}”`;
</script>
</body>
</html>
