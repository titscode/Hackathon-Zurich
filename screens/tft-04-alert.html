<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RIDE — TFT · Companion decision</title>
  <link rel="stylesheet" href="../design-system/tokens.css">
  <style>
    /* Décision du companion (SCREENS.md tft-04) · une idée : un choix. Navigation en fond sous le voile,
       une seule card, la vitesse reste lisible au-dessus du voile. */
    .col-c .tft-street { margin-top: 16px; }
    .col-c .tft-then { margin-top: 12px; }
    .col-r { position: relative; z-index: 6; }

    .decision { position: absolute; left: 96px; top: 50%; width: 1272px; transform: translateY(-50%); z-index: 7; }
    .decision .tft-body { margin-top: 10px; }
    .decision .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 32px; }
    .decision .tft-btn { width: 100%; }
    .decision .tft-hint { margin-top: 24px; justify-content: center; }
  </style>
</head>
<body>
<div class="tft page">
  <div class="tft-top"><span><b>RIDE</b> · Most fun</span><span id="eta"></span></div>

  <div class="tft-main ride">
    <div class="col-l">
      <svg width="220" height="220" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg>
    </div>
    <div class="col-c">
      <div class="tft-dist" id="dist"></div>
      <div class="tft-street" id="instr"></div>
      <div class="tft-then" id="then"></div>
    </div>
    <div class="col-r">
      <div class="tft-speed">
        <div class="tft-stat"><div class="tft-value xl" id="speed"></div><div class="tft-label">Speed</div></div>
        <div class="tft-limit" id="limit"></div>
      </div>
      <div class="tft-two">
        <div class="tft-stat"><div class="tft-value sm weather" id="wx"></div><div class="tft-label" id="wx-in"></div></div>
        <div class="tft-stat"><div class="tft-value sm" id="range"></div><div class="tft-label">Range</div></div>
      </div>
    </div>
  </div>

  <div class="tft-bottom"></div>

  <div class="tft-scrim"></div>
  <section class="tft-card decision">
    <div class="tft-title" id="title"></div>
    <div class="tft-body" id="body"></div>
    <div class="btns">
      <span class="tft-btn focus" id="keep"></span>
      <span class="tft-btn" id="switch"></span>
    </div>
    <div class="tft-hint">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><path d="M12 3v3M12 18v3"/></svg>
      <span id="hint"></span>
    </div>
  </section>
</div>

<script src="data.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const M = RIDE.rideMode, A = RIDE.tft.alert, alt = segByName(A.alt);
  $("eta").textContent = `ETA ${M.eta} · ${M.remaining} left`;
  $("dist").textContent = M.dist; $("instr").textContent = M.instr; $("then").textContent = M.then;
  $("speed").innerHTML = `${M.speed}<span class="tft-unit">${M.speedUnit}</span>`;
  $("limit").textContent = RIDE.tft.speedLimit;
  $("wx").textContent = M.weather; $("wx-in").textContent = M.weatherIn; $("range").textContent = M.range;

  $("title").textContent = A.title;
  $("body").innerHTML = `<b>${alt.name} stays dry</b> · +10 min · <span class="tft-stars">${star(26)}</span> ${alt.rating}`;
  $("keep").textContent = A.keep;
  $("switch").textContent = A.switchTo;
  $("hint").textContent = `Turn the wheel, press to choose · or say “${A.say}”`;
</script>
</body>
</html>
