<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=390, initial-scale=1">
  <title>RIDE — Route</title>
  <link rel="stylesheet" href="../design-system/leaflet/leaflet.css">
  <link rel="stylesheet" href="../design-system/tokens.css">
  <style>
    /* Carte réelle sur 58 % de la hauteur (SCREENS.md 04). */
    .map-slot { position: absolute; inset: 0 0 auto 0; height: 58%; background: var(--bg); z-index: 0; }
    /* Voile sous la status bar : les labels de la carte ne passent pas sous l'heure (overlay sur image, §3) */
    .map-scrim { position: absolute; left: 0; right: 0; top: 0; height: 64px; z-index: 5; pointer-events: none;
                 background: linear-gradient(to bottom, rgba(10,11,13,.8), rgba(10,11,13,0)); }
    /* Fond de carte et filtre : tokens.css §5 (.map-osm / .map-dark), posés par rideTileLayer(). */

    .statusbar { position: absolute; top: 0; left: 0; right: 0; }

    /* Barre de destination posée sur la carte */
    .dest {
      position: absolute; top: 62px; left: var(--gutter); right: var(--gutter); z-index: 10;
      height: 44px; padding: 0 14px; border-radius: 12px;
      background: var(--surface-2); border: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }
    .dest svg { color: var(--text-2); flex: none; }
    .dest .from { color: var(--text-3); }
    .dest .arrow { color: var(--text-3); margin: 0 2px; }

    /* Position actuelle : point blanc 12 px, halo accent-soft 28 px */
    .me { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); display: grid; place-items: center; }
    .me i { width: 12px; height: 12px; border-radius: 50%; background: var(--text-1); border: 2px solid var(--bg); box-sizing: content-box; }

    /* Bottom sheet */
    .sheet { position: absolute; left: 0; right: 0; bottom: 0; top: 55%; padding: 16px var(--gutter) 0; display: flex; flex-direction: column; z-index: 15; }
    .sheet > * { flex: none; }
    .sheet-handle { margin-bottom: 10px; }

    /* Slider Fast ↔ Fun */
    .slider { position: relative; height: 50px; }
    .slider .track { position: absolute; left: 14px; right: 14px; top: 12px; height: 4px; border-radius: 999px; background: var(--border); }
    .slider .stop { position: absolute; top: 11px; width: 6px; height: 6px; border-radius: 50%; background: var(--border-strong); transform: translateX(-50%); cursor: pointer; }
    .slider .stop::after { content: ""; position: absolute; inset: -14px; }
    .slider .knob {
      position: absolute; top: 0; width: 28px; height: 28px; border-radius: 50%;
      background: var(--text-1); border: 2px solid var(--accent); box-sizing: border-box;
      transform: translateX(-50%); transition: left 220ms var(--ease);
    }
    .slider .lbl { position: absolute; top: 32px; transform: translateX(-50%); white-space: nowrap; font-size: 12px; color: var(--text-3); transition: color 200ms var(--ease); }
    .slider .lbl.on { color: var(--text-1); }

    /* Chiffres clés */
    .kpis { display: flex; gap: 32px; margin-top: 8px; }
    .kpi .label { margin-top: 2px; }
    .fade { transition: opacity 200ms var(--ease); }
    .fade.out { opacity: 0; }
    .delta { margin-top: 6px; }

    /* 4 jauges en 2×2 */
    .gauges { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 20px; margin-top: 12px; }
    .g .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
    .g .row .caption { color: var(--text-2); }
    .g .row .body-strong { font-size: 14px; }

    /* Card segment : style partagé .seg (tokens.css) */
    .seg { margin-top: 10px; }

    .cta { margin-top: 10px; padding-bottom: 22px; }
  </style>
</head>
<body>
<div class="screen">
  <div class="map-slot"><div id="map"></div></div>
  <div class="map-scrim"></div>
  <div id="sb"></div>

  <a class="dest body" href="03-destination.html">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>
    <span class="from">Munich</span><span class="arrow">→</span><span>Garmisch-Partenkirchen</span>
  </a>

  <section class="sheet">
    <div class="sheet-handle"></div>

    <div class="slider" id="slider">
      <div class="track"></div>
      <div class="stop" data-i="0" style="left:14px"></div>
      <div class="stop" data-i="1" style="left:50%"></div>
      <div class="stop" data-i="2" style="left:calc(100% - 14px)"></div>
      <div class="knob" id="knob"></div>
      <span class="lbl" style="left:14px">Fast</span>
      <span class="lbl" style="left:50%">Balanced</span>
      <span class="lbl" style="left:calc(100% - 14px)">Fun</span>
    </div>

    <div class="kpis fade" id="kpis">
      <div class="kpi"><div class="display" id="k-time"></div><div class="label">Duration</div></div>
      <div class="kpi"><div class="display" id="k-km"></div><div class="label">Distance</div></div>
    </div>
    <div class="caption delta fade" id="delta"></div>

    <div class="gauges fade" id="gauges"></div>

    <a class="seg fade" id="seg" href="09-segment.html"></a>

    <div class="cta"><a class="btn btn-primary" href="10-ride-mode.html">Start ride</a></div>
  </section>

  <div id="hi"></div>
</div>

<script src="../design-system/leaflet/leaflet.js"></script>
<script src="../design-system/tiles/source.js"></script>
<script src="data.js"></script>
<script>
  document.getElementById("sb").innerHTML = statusBar();
  document.getElementById("hi").innerHTML = homeIndicator();

  /* ---------------------------------------------------------------- Carte */
  const map = L.map("map", { zoomControl: false, attributionControl: false, dragging: true, scrollWheelZoom: false, zoomSnap: 1 });
  rideTileLayer(map);

  const css = getComputedStyle(document.documentElement);
  const C = k => css.getPropertyValue(k).trim();
  /* DESIGN.md §1 route-selected : blanc 4 px, halo rgba(244,245,247,.25) 10 px, plus une retombée
     18 px à 8 % pour que le halo se lise comme un halo et non comme un contour. route-alt : 2.5 px à 60 %. */
  const round = { lineCap: "round", lineJoin: "round" };
  const lines = RIDE.routes.map(r => ({
    glow: L.polyline(r.path, { color: C("--route-selected"), vw: 18, opacity: 0, interactive: false, ...round }).addTo(map),
    halo: L.polyline(r.path, { color: C("--route-selected"), vw: 10, opacity: 0, interactive: false, ...round }).addTo(map),
    line: L.polyline(r.path, { color: C("--route-alt"), vw: 2.5, opacity: 0.6, ...round }).addTo(map),
  }));
  L.marker(RIDE.routes[0].path[0], { icon: L.divIcon({ className: "", html: '<div class="me keep-size"><i></i></div>', iconSize: [28, 28], iconAnchor: [14, 14] }), interactive: false }).addTo(map);

  const all = RIDE.routes.flatMap(r => r.path);
  const S = rideFitBounds(map, L.latLngBounds(all), { paddingTopLeft: [28, 118], paddingBottomRight: [28, 40] });

  /* ------------------------------------------------- Slider : 3 états */
  const seg = RIDE.segments.find(s => s.name === "Kochelsee Uferstraße");
  const segFun = RIDE.segments.find(s => s.name === "Kesselberg");
  const fades = ["kpis", "delta", "gauges", "seg"].map(id => document.getElementById(id));
  const knob = document.getElementById("knob");
  const lbls = document.querySelectorAll(".slider .lbl");
  const stopsLeft = ["14px", "50%", "calc(100% - 14px)"];

  function gauge(label, value, pct) {
    return `<div class="g"><div class="row"><span class="caption">${label}</span><span class="body-strong">${value}</span></div>
      <div class="gauge-track"><div class="gauge-fill" style="width:${pct}%"></div></div></div>`;
  }

  function render(i) {
    const r = RIDE.routes[i];
    document.getElementById("k-time").textContent = r.time;
    document.getElementById("k-km").textContent = r.km;
    document.getElementById("delta").textContent = r.delta;
    document.getElementById("gauges").innerHTML =
      gauge("Curviness", `${r.curviness}/10`, r.curviness * 10) +
      gauge("Scenic", `${r.scenic}/10`, r.scenic * 10) +
      gauge("Weather", r.weather, r.weather === "Clear" ? 100 : 55) +
      gauge("Community", r.community ?? "—", r.community ? r.community / 5 * 100 : 0);
    const s = i === 2 ? segFun : seg;
    const segEl = document.getElementById("seg");
    if (r.segments.length === 0) {
      segEl.innerHTML = `<div class="t"><p class="name t2">No community segments on this route</p><div class="meta">Motorway only · A95</div></div>`;
    } else {
      segEl.innerHTML = `<img class="avatar" src="../assets/avatars/${s.avatar}.png" alt="">
        <div class="t"><p class="name">${s.name}</p><div class="meta">${star(11)} ${s.rating} · ${s.author} · ${s.km} · curv ${s.curv}</div></div>
        <span class="count">${r.segments.length} segment${r.segments.length > 1 ? "s" : ""}</span>`;
    }
    lines.forEach((l, j) => {
      const on = j === i;
      l.glow.setStyle({ opacity: on ? 0.08 : 0 });
      l.halo.setStyle({ opacity: on ? 0.25 : 0 });
      l.line.setStyle({ color: on ? C("--route-selected") : C("--route-alt"), weight: (on ? 4 : 2.5) / S, opacity: on ? 1 : 0.6 });
    });
    /* Ordre des couches : alternatives < halo < tracé sélectionné */
    lines[i].glow.bringToFront(); lines[i].halo.bringToFront(); lines[i].line.bringToFront();
    knob.style.left = stopsLeft[i];
    lbls.forEach((el, j) => el.classList.toggle("on", j === i));
  }

  let state = 1;
  render(state);
  document.querySelectorAll(".slider .stop").forEach(st => st.addEventListener("click", () => {
    const i = +st.dataset.i; if (i === state) return;
    fades.forEach(f => f.classList.add("out"));
    setTimeout(() => { state = i; render(i); fades.forEach(f => f.classList.remove("out")); }, 200);
  }));
</script>
</body>
</html>
